<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Dimsum Aditya - Enterprise ERP Control Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* ========================================================
         🔥 VAKSIN 2: ANTI GOYANG INUL (SCROLL KANAN-KIRI) & POP-UP LOCK
         ======================================================== */
      html, body {
        max-width: 100vw; /* Kunci lebar maksimal sejagat layar */
        overflow-x: hidden; /* Haramkan geser kanan-kiri */
        -webkit-text-size-adjust: 100%; /* Cegah HP nge-zoom font diam-diam */
        touch-action: manipulation; /* Bikin tombol di HP makin responsif dipencet */
      }

      /* Kunci layar belakang biar gak ikut jalan pas Pop-up Terbuka */
      body:has(.fixed.inset-0) {
        overflow: hidden !important;
      }

      /* ========================================================
         1. GLOBAL UI & ENTERPRISE SCROLLBAR
         ======================================================== */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      .custom-scrollbar { 
        -webkit-overflow-scrolling: touch; 
        will-change: transform; 
      }

      /* ========================================================
         2. SHIMMER / SKELETON LOADING UI (PHASE 11)
         ======================================================== */
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(to right, #f1f5f9 0%, #e2e8f0 20%, #f1f5f9 40%, #f1f5f9 100%);
        background-repeat: no-repeat;
        background-size: 1000px 100%;
        animation: shimmer 1.5s infinite linear forwards;
        border-radius: 12px;
      }

      /* ========================================================
         3. SMART TABLE OPTIMIZATION
         ======================================================== */
      .table-compact th, .table-compact td { 
        padding: 8px 12px !important; 
        font-size: 0.75rem !important; 
      }
      .table-sticky-header th { 
        position: sticky; 
        top: 0; 
        background-color: #f8fafc; 
        z-index: 10; 
      }

      /* ========================================================
         4. PRINT STABILITY ENGINE (A4, THERMAL 58mm, DOT MATRIX)
         ======================================================== */
      @media print {
        body { 
          -webkit-print-color-adjust: exact !important; 
          print-color-adjust: exact !important; 
          background-color: white !important; 
          color: black !important;
        }
        
        body > #root { display: none !important; }
        #print-root { display: block !important; }
        aside, header, .no-print, button { display: none !important; }
        a[href]:after { content: none !important; }
        
        main { 
          width: 100% !important; 
          margin: 0 !important; 
          padding: 0 !important; 
          overflow: visible !important; 
          position: static !important;
        }
        
        @page { size: A4 landscape; margin: 10mm; }

        .print-a4-recap {
          font-family: Arial, sans-serif !important;
          font-size: 11pt !important;
          color: black !important;
          background: white !important;
          width: 210mm;
          min-height: 297mm;
          padding: 15mm;
          margin: 0 auto;
        }

        .thermal-58 @page { size: 58mm auto; margin: 2mm 0mm; }
        .thermal-58 { 
          width: 54mm !important; margin: 0 auto !important; 
          font-family: 'Courier New', Courier, monospace !important; 
          font-size: 11px !important; line-height: 1.3 !important; 
          page-break-after: auto; overflow: hidden;
        }
        .thermal-58 th, .thermal-58 td { padding: 3px 0 !important; }
        .thermal-58 .dashed-line { border-top: 1px dashed black !important; margin: 6px 0 !important; }

        .print-dot-matrix {
          font-family: 'Courier New', Courier, monospace !important;
          font-size: 13pt !important; line-height: 1.4 !important;
          color: black !important; background: white !important;
          width: 100%; margin: 0; padding: 15px; box-sizing: border-box; overflow: hidden;
        }
      }

      @media screen { #print-root { display: none !important; } }

      /* ========================================================
         5. HOLOGRAPHIC WHITE FLUID GRADIENT BACKGROUND
         ======================================================== */
      body {
        /* Dasar Putih Bersih */
        background-color: #ffffff;
        
        /* Colorful tapi super transparan (Aura Apple/macOS) */
        background-image: 
          radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),    /* Indigo/Ungu Soft */
          radial-gradient(circle at 90% 10%, rgba(236, 72, 153, 0.12) 0%, transparent 45%),    /* Pink Soft */
          radial-gradient(circle at 90% 90%, rgba(14, 165, 233, 0.12) 0%, transparent 45%),    /* Biru Langit Soft */
          radial-gradient(circle at 10% 90%, rgba(245, 158, 11, 0.12) 0%, transparent 45%);    /* Kuning/Amber Soft */
          
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-size: cover;
        min-height: 100vh;
      }

      #root, .app-container { background: transparent !important; }
    </style>
  </head>
  <body class="antialiased text-slate-800 selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
