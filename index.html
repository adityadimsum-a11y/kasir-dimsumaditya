<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Dimsum Aditya - Enterprise ERP Control Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* ========================================================
         🔥 VAKSIN 2: ANTI GOYANG INUL (SCROLL KANAN-KIRI) & POP-UP LOCK
         ======================================================== */
      html, body {
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body:has(.fixed.inset-0) {
        overflow: hidden !important;
      }

      /* ========================================================
         🎨 3. SULTAN HOLOGRAPHIC FLUID (DIMSUM ADITYA PALETTE)
         ======================================================== */
      
      @keyframes fluidHolo {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      body {
        /* Warna Dasar Off-White biar bersih */
        background-color: #f8fafc;
        /* Gradasi Persis Seperti Halaman Login Bos (Merah, Orange, Kuning) */
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.18) 0%, transparent 50%),    /* Merah Dimsum */
          radial-gradient(circle at 90% 30%, rgba(249, 115, 22, 0.15) 0%, transparent 50%),   /* Orange */
          radial-gradient(circle at 50% 90%, rgba(234, 179, 8, 0.15) 0%, transparent 50%);    /* Kuning Kukusan */
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-size: 150% 150%;
        animation: fluidHolo 15s ease-in-out infinite; 
        min-height: 100vh;
      }

      /* ✨ THE TRUE FROSTED GLASS (KACA BURAM ASLI) */
      .card-holo {
        background: rgba(255, 255, 255, 0.45); /* Putih transparan 45% (Rahasia nembus kaca) */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8); /* Pantulan garis kaca putih terang */
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); /* Bayangan super soft */
      }

      /* ✨ TOMBOL DIMSUM ADITYA (Gradasi Merah ke Amber) */
      .btn-holo {
        background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);
        background-size: 200% auto;
        color: white !important;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .btn-holo:hover {
        background-position: right center;
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
        transform: translateY(-1px);
      }
      .btn-holo:active {
        transform: translateY(1px);
      }

      /* ✨ TEKS GRADASI DIMSUM ADITYA */
      .text-holo-gradient {
        background: linear-gradient(to right, #ef4444, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* ========================================================
         4. GLOBAL UI & ENTERPRISE SCROLLBAR
         ======================================================== */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .custom-scrollbar { -webkit-overflow-scrolling: touch; will-change: transform; }

      /* ========================================================
         5. SHIMMER & TABLE OPTIMIZATION
         ======================================================== */
      @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
      .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(to right, #f1f5f9 0%, #e2e8f0 20%, #f1f5f9 40%, #f1f5f9 100%);
        background-repeat: no-repeat; background-size: 1000px 100%;
        animation: shimmer 1.5s infinite linear forwards; border-radius: 12px;
      }
      .table-compact th, .table-compact td { padding: 8px 12px !important; font-size: 0.75rem !important; }
      .table-sticky-header th { position: sticky; top: 0; background-color: rgba(248, 250, 252, 0.9); backdrop-filter: blur(4px); z-index: 10; }

      /* ========================================================
         6. PRINT STABILITY ENGINE (A4, THERMAL 58mm, DOT MATRIX)
         ======================================================== */
      @media print {
        body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background-color: white !important; background-image: none !important; color: black !important; }
        body > #root { display: none !important; } #print-root { display: block !important; }
        aside, header, .no-print, button { display: none !important; } a[href]:after { content: none !important; }
        main { width: 100% !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; position: static !important; }
        @page { size: A4 landscape; margin: 10mm; }
        .print-a4-recap { font-family: Arial, sans-serif !important; font-size: 11pt !important; color: black !important; background: white !important; width: 210mm; min-height: 297mm; padding: 15mm; margin: 0 auto; }
        .thermal-58 @page { size: 58mm auto; margin: 2mm 0mm; }
        .thermal-58 { width: 54mm !important; margin: 0 auto !important; font-family: 'Courier New', Courier, monospace !important; font-size: 11px !important; line-height: 1.3 !important; page-break-after: auto; overflow: hidden; }
        .thermal-58 th, .thermal-58 td { padding: 3px 0 !important; } .thermal-58 .dashed-line { border-top: 1px dashed black !important; margin: 6px 0 !important; }
        .print-dot-matrix { font-family: 'Courier New', Courier, monospace !important; font-size: 13pt !important; line-height: 1.4 !important; color: black !important; background: white !important; width: 100%; margin: 0; padding: 15px; box-sizing: border-box; overflow: hidden; }
      }
      @media screen { #print-root { display: none !important; } }
      #root, .app-container { background: transparent !important; }
    </style>
  </head>
  <body class="antialiased text-slate-800 selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
