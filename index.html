<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Dimsum Aditya - Enterprise ERP Control Center</title>
    
    <meta name="robots" content="noindex, nofollow, noarchive" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* ========================================================
         🔥 RAHASIA SULTAN: LOCK FONT INTER DI SELURUH ELEMEN APLIKASI
         ======================================================== */
      *, *::before, *::after, body, button, input, select, textarea, span, div, h1, h2, h3, h4, h5, h6, table, td, th {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      }

      /* ========================================================
         🔥 VAKSIN ANTI GOYANG INUL & POP-UP LOCK
         ======================================================== */
      html, body {
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        background-color: #f8fafc; 
        color: #1e293b;
      }

      body:has(.fixed.inset-0) {
        overflow: hidden !important;
      }

      /* ========================================================
         🎨 ALIRAN CLEAN FLAT ENTERPRISE (GRAB-STYLE)
         ======================================================== */
      
      /* 1. KARTU FLAT BERSIH (Rata, Tegas & Rapi) */
      .card-holo {
        background-color: #ffffff !important; 
        border: 1px solid #e2e8f0 !important; 
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05) !important; 
        border-radius: 12px !important; 
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      /* 2. TOMBOL SOLID AKSEN MERAH DIMSUM (NORMAL CASE - TYPOGRAPHY PREMIUM) */
      .btn-holo {
        background-color: #dc2626 !important; 
        color: white !important;
        font-weight: 600 !important;
        border-radius: 8px !important; 
        transition: all 0.2s ease !important;
        border: 1px solid transparent !important;
        text-transform: normal-case !important; 
        letter-spacing: normal !important;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
      }
      .btn-holo:hover {
        background-color: #b91c1c !important; 
      }
      .btn-holo:active {
        transform: scale(0.98) !important;
      }

      /* 3. TEKS TEGAS HITAM MURNI (MENGHAPUS GRADASI WARNA LAMA) */
      .text-holo-gradient {
        color: #0f172a !important; 
        background: none !important;
        -webkit-background-clip: initial !important;
        -webkit-text-fill-color: initial !important;
      }

      /* ========================================================
         GLOBAL UI & SCROLLBAR
         ======================================================== */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .custom-scrollbar { -webkit-overflow-scrolling: touch; will-change: transform; }

      /* ========================================================
         SHIMMER & TABLE OPTIMIZATION
         ======================================================== */
      @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
      .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(to right, #f1f5f9 0%, #e2e8f0 20%, #f1f5f9 40%, #f1f5f9 100%);
        background-repeat: no-repeat; background-size: 1000px 100%;
        animation: shimmer 1.5s infinite linear forwards; border-radius: 12px;
      }
      .table-compact th, .table-compact td { padding: 12px 16px !important; font-size: 0.8rem !important; }
      .table-sticky-header th { position: sticky; top: 0; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; z-index: 10; }

      /* ========================================================
         PRINT STABILITY ENGINE
         ======================================================== */
      @media print {
        body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background-color: white !important; background-image: none !important; color: black !important; }
        body > #root { display: none !important; } #print-root { display: block !important; }
        aside, header, .no-print, button { display: none !important; } a[href]:after { content: none !important; }
        main { width: 100% !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; position: static !important; }
        @page { size: A4 landscape; margin: 10mm; }
        .print-a4-recap { font-family: Arial, sans-serif !important; font-size: 11pt !important; color: black !important; background: white !important; width: 210mm; min-height: 297mm; padding: 15mm; margin: 0 auto; }
        .thermal-58 @page { size: 58mm auto; margin: 2mm 0mm; }
        .thermal-58 { width: 54mm !important; margin: 0 auto !important; font-family: 'Courier New', Courier, monospace !important; font-size: 11px !important; line-height: 1.3 !important; page-break-after: auto; overflow: hidden; }
        .thermal-58 th, .thermal-58 td { padding: 3px 0 !important; } .thermal-58 .dashed-line { border-top: 1px dashed black !important; margin: 6px 0 !important; }
        .print-dot-matrix { font-family: 'Courier New', Courier, monospace !important; font-size: 13pt !important; line-height: 1.4 !important; color: black !important; background: white !important; width: 100%; margin: 0; padding: 15px; box-sizing: border-box; overflow: hidden; }
      }
      @media screen { #print-root { display: none !important; } }
      #root, .app-container { background: transparent !important; }
    </style>
  </head>
  <body class="antialiased selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
