<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dimsum Aditya - Enterprise ERP Control Center</title>
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ENTERPRISE DESIGN SYSTEM, PRINT ENGINE & FLUID BACKGROUND -->
    <style>
      /* ========================================================
         1. GLOBAL UI & ENTERPRISE SCROLLBAR
         ======================================================== */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      /* Mobile Hardware Acceleration Scroll */
      .custom-scrollbar { 
        -webkit-overflow-scrolling: touch; 
        will-change: transform; 
      }

      /* ========================================================
         2. SHIMMER / SKELETON LOADING UI (PHASE 11)
         ======================================================== */
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(to right, #f1f5f9 0%, #e2e8f0 20%, #f1f5f9 40%, #f1f5f9 100%);
        background-repeat: no-repeat;
        background-size: 1000px 100%;
        animation: shimmer 1.5s infinite linear forwards;
        border-radius: 12px;
      }

      /* ========================================================
         3. SMART TABLE OPTIMIZATION
         ======================================================== */
      .table-compact th, .table-compact td { 
        padding: 8px 12px !important; 
        font-size: 0.75rem !important; 
      }
      .table-sticky-header th { 
        position: sticky; 
        top: 0; 
        background-color: #f8fafc; 
        z-index: 10; 
      }

      /* ========================================================
         4. PRINT STABILITY ENGINE (A4, THERMAL 58mm, DOT MATRIX)
         ======================================================== */
      @media print {
        body { 
          -webkit-print-color-adjust: exact !important; 
          print-color-adjust: exact !important; 
          background-color: white !important; 
          color: black !important;
        }
        
        /* Sembunyikan Navigasi, Header, dan Elemen no-print */
        body > #root { display: none !important; }
        #print-root { display: block !important; }
        aside, header, .no-print, button { display: none !important; }
        a[href]:after { content: none !important; }
        
        /* Maksimalkan Viewport Cetak */
        main { 
          width: 100% !important; 
          margin: 0 !important; 
          padding: 0 !important; 
          overflow: visible !important; 
          position: static !important;
        }
        
        /* DEFAULT SETTING: A4 LANDSCAPE (REPORTS & ANALYTICS) */
        @page { 
          size: A4 landscape; 
          margin: 10mm; 
        }

        /* REKAP A4 */
        .print-a4-recap {
          font-family: Arial, sans-serif !important;
          font-size: 11pt !important;
          color: black !important;
          background: white !important;
          width: 210mm;
          min-height: 297mm;
          padding: 15mm;
          margin: 0 auto;
        }

        /* OVERRIDE FOR THERMAL 58mm POS RECEIPT (KASIR OUTLET) */
        .thermal-58 @page { 
          size: 58mm auto; 
          margin: 2mm 0mm; 
        }
        .thermal-58 { 
          width: 54mm !important; 
          margin: 0 auto !important; 
          font-family: 'Courier New', Courier, monospace !important; 
          font-size: 11px !important; 
          line-height: 1.3 !important; 
          page-break-after: auto;
          overflow: hidden;
        }
        .thermal-58 th, .thermal-58 td { padding: 3px 0 !important; }
        .thermal-58 .dashed-line { border-top: 1px dashed black !important; margin: 6px 0 !important; }

        /* DOT MATRIX LX-310 (LEBIH BESAR & RENGGANG) */
        .print-dot-matrix {
          font-family: 'Courier New', Courier, monospace !important;
          font-size: 13pt !important; 
          line-height: 1.4 !important;
          color: black !important;
          background: white !important;
          width: 100%;
          margin: 0;
          padding: 15px;
          box-sizing: border-box;
          overflow: hidden;
        }
      }

      /* Sembunyikan div print saat di layar normal */
      @media screen {
        #print-root { display: none !important; }
      }

      /* ========================================================
         5. FLUID MESH GRADIENT BACKGROUND
         ======================================================== */
      body {
        /* Warna dasar putih tulang */
        background-color: #fafafa;
        
        /* Sihir Fluid Gradient murni tanpa file gambar */
        background-image: 
          radial-gradient(circle at 10% 25%, rgba(255, 166, 178, 0.35) 0%, transparent 45%),
          radial-gradient(circle at 90% 50%, rgba(255, 206, 153, 0.35) 0%, transparent 50%),
          radial-gradient(circle at 30% 90%, rgba(255, 240, 168, 0.35) 0%, transparent 45%);
          
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-size: cover;
        min-height: 100vh;
      }

      /* Pastikan elemen di atasnya tetap mulus & tembus pandang */
      #root, .app-container {
        background: transparent !important;
      }
    </style>
  </head>
  <body class="antialiased text-slate-800 selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <!-- Mesin React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
