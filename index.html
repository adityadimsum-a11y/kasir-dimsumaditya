<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir Dimsum Aditya</title>
    <!-- Tailwind CSS (Desain) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
<!-- KODE CSS KHUSUS PERFORMA & CETAK (PHASE 11) -->
    <style>
      /* PAGINATION & LAZY LOAD SKELETON */
      @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
      .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(to right, #f1f5f9 0%, #e2e8f0 20%, #f1f5f9 40%, #f1f5f9 100%);
        background-repeat: no-repeat; background-size: 1000px 100%;
        animation: shimmer 1.5s infinite linear forwards;
        border-radius: 8px;
      }
      .skeleton-text { height: 16px; margin-bottom: 8px; width: 100%; }

      /* MOBILE SCROLL OPTIMIZATION (Hardware Acceleration) */
      .custom-scrollbar { -webkit-overflow-scrolling: touch; will-change: transform; }

      /* PRINT STABILITY ENGINE (ANTI BLANK/CUT) */
      @media print {
        body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background-color: white !important; }
        aside, header, .no-print { display: none !important; }
        main { width: 100% !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; position: static !important; }
        
        @page { size: A4 landscape; margin: 10mm; }
        
        .thermal-58 @page { size: 58mm auto; margin: 2mm; }
        .thermal-58 { 
            width: 54mm !important; margin: 0 auto; 
            font-family: 'Courier New', Courier, monospace; font-size: 11px; 
            color: black; page-break-after: auto; overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
