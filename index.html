<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Dimsum Aditya - Enterprise ERP Control Center</title>
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CLEAN ENTERPRISE DESIGN SYSTEM (GRAB-MERCHANT STYLE) -->
    <style>
      /* ========================================================
         🔥 VAKSIN ANTI GOYANG INUL & POP-UP LOCK (TETAP ADA)
         ======================================================== */
      html, body {
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        /* Background SLATE-50: Bersih, Terang, Gak Bikin Mata Capek */
        background-color: #f8fafc; 
        color: #1e293b;
      }

      body:has(.fixed.inset-0) {
        overflow: hidden !important;
      }

      /* ========================================================
         🎨 ALIRAN CLEAN FLAT ENTERPRISE (GRAB-STYLE)
         ======================================================== */
      
      /* 1. KARTU FLAT BERSIH (Bukan Kaca Buram Lagi) */
      .card-holo {
        background-color: #ffffff; /* Putih Solid */
        border: 1px solid #e2e8f0; /* Border abu-abu super tipis */
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Bayangan sangat tipis / nyaris flat */
        border-radius: 16px; /* Sudut membulat modern */
      }

      /* 2. TOMBOL SOLID AKSEN MERAH DIMSUM (Bukan Gradasi) */
      .btn-holo {
        background-color: #dc2626; /* Merah Tegas ala logo Dimsum Aditya */
        color: white !important;
        font-weight: 700;
        border-radius: 8px; /* Lebih kotak ala aplikasi enterprise/merchant */
        transition: all 0.2s ease;
        border: 1px solid transparent;
        text-transform: none; /* Huruf gak usah kapital semua biar elegan */
        letter-spacing: normal;
      }
      .btn-holo:hover {
        background-color: #b91c1c; /* Merah lebih gelap saat di-hover */
      }
      .btn-holo:active {
        transform: scale(0.98);
      }

      /* 3. TEKS TEGAS (Bukan Gradasi Lagi) */
      .text-holo-gradient {
        color: #0f172a; /* Hitam pekat tegas ala Grab */
        background: none;
        -webkit-background-clip: initial;
        -webkit-text-fill-color: initial;
      }

      /* ========================================================
         GLOBAL UI & SCROLLBAR (TETAP RAPI)
         ======================================================== */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .custom-scrollbar { -webkit-overflow-scrolling: touch; will-change: transform; }

      /* ========================================================
         SHIMMER & TABLE OPTIMIZATION
         ======================================================== */
      @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
      .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(to right, #f1f5f9 0%, #e2e8f0 20%, #f1f5f9 40%, #f1f5f9 100%);
        background-repeat: no-repeat; background-size: 1000px 100%;
        animation: shimmer 1.5s infinite linear forwards; border-radius: 12px;
      }
      .table-compact th, .table-compact td { padding: 12px 16px !important; font-size: 0.8rem !important; }
      .table-sticky-header th { position: sticky; top: 0; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; z-index: 10; }

      /* ========================================================
         PRINT STABILITY ENGINE (TETAP AMAN)
         ======================================================== */
      @media print {
        body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background-color: white !important; background-image: none !important; color: black !important; }
        body > #root { display: none !important; } #print-root { display: block !important; }
        aside, header, .no-print, button { display: none !important; } a[href]:after { content: none !important; }
        main { width: 100% !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; position: static !important; }
        @page { size: A4 landscape; margin: 10mm; }
        .print-a4-recap { font-family: Arial, sans-serif !important; font-size: 11pt !important; color: black !important; background: white !important; width: 210mm; min-height: 297mm; padding: 15mm; margin: 0 auto; }
        .thermal-58 @page { size: 58mm auto; margin: 2mm 0mm; }
        .thermal-58 { width: 54mm !important; margin: 0 auto !important; font-family: 'Courier New', Courier, monospace !important; font-size: 11px !important; line-height: 1.3 !important; page-break-after: auto; overflow: hidden; }
        .thermal-58 th, .thermal-58 td { padding: 3px 0 !important; } .thermal-58 .dashed-line { border-top: 1px dashed black !important; margin: 6px 0 !important; }
        .print-dot-matrix { font-family: 'Courier New', Courier, monospace !important; font-size: 13pt !important; line-height: 1.4 !important; color: black !important; background: white !important; width: 100%; margin: 0; padding: 15px; box-sizing: border-box; overflow: hidden; }
      }
      @media screen { #print-root { display: none !important; } }
      #root, .app-container { background: transparent !important; }
    </style>
  </head>
  <body class="antialiased selection:bg-red-500 selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
